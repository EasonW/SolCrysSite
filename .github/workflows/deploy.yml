name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 每次有代码推送到 main 分支时自动运行

permissions:
  contents: write # 允许 Action 写入 gh-pages 分支

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 使用较新的 Node.js 版本
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci # 比 npm install 更稳定，基于 package-lock.json 安装
        
      - name: Build project
        # Lead-intake routing — see src/lib/lead-intake.ts.
        # When VITE_LEAD_INTAKE_URL is unset (current default), forms keep
        # using Formspree. Uncomment the env block below AFTER:
        #   1. PR #824 (geo-platform) is deployed to app.solcrys.com
        #   2. Migration 132 applied in production DB
        #   3. CORS smoke test passes:
        #        curl -i -X OPTIONS https://app.solcrys.com/api/lead-intake \
        #          -H "Origin: https://solcrys.com" \
        #          -H "Access-Control-Request-Method: POST"
        #      Expect HTTP 204 + Access-Control-Allow-Origin: https://solcrys.com
        # Then push to trigger a rebuild. DUAL_WRITE=1 runs Stage 1 (~1 week
        # mirroring to Formspree for audit) — drop it to "0" for cutover.
        #
        # env:
        #   VITE_LEAD_INTAKE_URL: https://app.solcrys.com/api/lead-intake
        #   VITE_LEAD_INTAKE_DUAL_WRITE: "1"
        run: npm run build # 这会运行我们刚刚配置的带有 404.html 的编译脚本
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # 把编译后的 dist 文件夹推送到 gh-pages 分支
