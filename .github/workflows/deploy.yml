name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 每次有代码推送到 main 分支时自动运行

permissions:
  contents: write # 允许 Action 写入 gh-pages 分支

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 使用较新的 Node.js 版本
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci # 比 npm install 更稳定，基于 package-lock.json 安装
        
      - name: Build project
        # Lead-intake routing — see src/lib/lead-intake.ts.
        # DUAL_WRITE=1 runs Stage 1 (mirroring to Formspree for audit). Once
        # we've reconciled lead counts between the two for ~1 week, set
        # DUAL_WRITE to "0" or delete it to fully cut over.
        #
        # If geo-platform's lead-intake is down (or migration 132 not yet
        # applied), submitLeadIntake() automatically falls back to Formspree
        # — no user-visible failure. See src/lib/lead-intake.ts.
        env:
          VITE_LEAD_INTAKE_URL: https://app.solcrys.com/api/lead-intake
          VITE_LEAD_INTAKE_DUAL_WRITE: "1"
        run: npm run build # 这会运行我们刚刚配置的带有 404.html 的编译脚本
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # 把编译后的 dist 文件夹推送到 gh-pages 分支

      # IndexNow ping (Bing/Yandex/Naver/Seznam; Google ignores it). The key
      # is deliberately committed in plain text: IndexNow validates ownership
      # by fetching https://solcrys.com/<KEY>.txt, so the key is public by
      # protocol design — it is not a secret. Key file lives in public/.
      # The ping is best-effort: continue-on-error so an IndexNow outage
      # never fails a deploy.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: b6c29c8c26d1917dc4b2c74f74b84906
        run: node scripts/ping-indexnow.mjs
