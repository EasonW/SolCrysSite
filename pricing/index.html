<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=https://app.solcrys.com/pricing" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <title>Pricing — SolCrys</title>
    <meta name="description" content="SolCrys pricing has moved to app.solcrys.com/pricing." />
    <script>
      (function () {
        var dest = "https://app.solcrys.com/pricing";
        function resolvedTheme() {
          try {
            var stored = window.localStorage && window.localStorage.getItem('solcrys-theme');
            if (stored === 'light' || stored === 'dark') return stored;
          } catch (e) {}
          try {
            return window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          } catch (e) { return 'light'; }
        }
        try {
          // Preserve any inbound UTM / referrer params, then layer on
          // theme. We always pass theme (even 'light' system default)
          // so the app honors what the visitor sees here regardless of
          // any stale app-side localStorage preference.
          var params = new URLSearchParams(window.location.search);
          // This page never loads the SPA bundle, so it applies
          // src/lib/attribution.ts's rule inline: UTMs in the URL win,
          // then an outside referrer's host, then the tab's stored
          // source (sessionStorage solcrys_utm).
          var KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
          // Blank values don't count as UTMs (same as captureAttribution).
          if (!KEYS.some(function (k) { return (params.get(k) || '').trim(); })) {
            KEYS.forEach(function (k) { params.delete(k); });
            var source = null;
            try {
              var ref = new URL(document.referrer);
              var host = ref.hostname.toLowerCase().replace(/^www\./, '');
              if (/^https?:$/.test(ref.protocol) && host &&host !== window.location.hostname.toLowerCase() && !/(^|\.)solcrys\.com$/.test(host)) {
                source = host.slice(0, 64);
              }
            } catch (e) {}
            if (source) {
              params.set('utm_source', source);
              params.set('utm_medium', 'referral');
            } else {
              try {
                var stored = JSON.parse(window.sessionStorage.getItem('solcrys_utm') || 'null');
                KEYS.forEach(function (k) {
                  var v = stored && stored[k];
                  if (typeof v === 'string' && v.trim()) params.set(k, v.trim().slice(0, 64));
                });
              } catch (e) {}
            }
          }
          if (!params.has('theme')) params.set('theme', resolvedTheme());
          var qs = params.toString();
          if (qs) dest += '?' + qs;
        } catch (e) { /* localStorage / URL access blocked — fall through */ }
        window.location.replace(dest);
      })();</script>
  </head>
  <body>
    <p style="font-family: system-ui; padding: 2rem;">
      Redirecting to <a href="https://app.solcrys.com/pricing">app.solcrys.com/pricing</a>…
    </p>
  </body>
</html>
